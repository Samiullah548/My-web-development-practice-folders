<!-- // some important points to remember about DOM
// 1. DOM is a programming interface for HTML and XML documents. It represents the page so that programs can change the document structure, style, and content.
// 2. The DOM represents the document as a tree of nodes, where each node represents an element, attribute, or piece of text in the document.
// 3. The DOM allows developers to manipulate the document using JavaScript, enabling dynamic content and interactivity on web pages.

difference between innerHTML and innerText
1. innerHTML: This property returns the HTML content of an element as a string. It includes all the HTML tags and their content within the element. When you set innerHTML, it replaces the existing content of the element with the new HTML content.
2. innerText: This property returns the visible text content of an element as a string. It does not include any HTML tags or hidden elements. When you set innerText, it replaces the existing text content of the element with the new text content, and any HTML tags will be treated as plain text. -->
